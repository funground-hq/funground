# CI, spent wisely (docs/developer/CI_Guidance.md). The full suite runs on the maintainer's Windows
# machine before every push; GitHub adds what that machine cannot.
#
#   a push that changes code     Windows, Python 3.11 (one job)
#   a push of records or prose   nothing (the path filter below)
#   a pull request to main,      Windows 3.11-3.14, then Linux 3.11-3.14, then macOS 3.11 and 3.14;
#   or Run workflow (release)    each stage only after the one before has passed
#
# Release tags are not tested again here: the tagged commit was tested first, and release.yml
# smoke-tests the built package on the three systems.

name: ci

on:
  push:
    branches: ["**"]
    paths:
      - "funground/**"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "docs/guide/**"
      - "docs/reference/**"
      - "docs/gallery/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "funground/**"
      - "tests/**"
      - "examples/**"
      - "tools/**"
      - "docs/guide/**"
      - "docs/reference/**"
      - "docs/gallery/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      scope:
        description: "everyday: Windows 3.11 only; release: the three systems, one after another"
        type: choice
        options: [release, everyday]
        default: release

concurrency:                              # a newer push cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/tests.yml
    with:
      os: windows-latest
      pythons: >-
        ${{ (github.event_name == 'pull_request' || inputs.scope == 'release')
            && '["3.11", "3.12", "3.13", "3.14"]' || '["3.11"]' }}

  linux:
    needs: windows
    if: github.event_name == 'pull_request' || inputs.scope == 'release'
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      pythons: '["3.11", "3.12", "3.13", "3.14"]'

  macos:
    needs: linux
    uses: ./.github/workflows/tests.yml
    with:
      os: macos-latest
      pythons: '["3.11", "3.14"]'          # macOS minutes cost about 10 times Linux's; the versions between are covered above
