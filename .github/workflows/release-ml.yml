# Release funground-ml (the models library, ml/) to TestPyPI and PyPI with trusted publishing, as release.yml does for
# funground. Its own workflow, so each package is released on its own tag.
#
# On PyPI and TestPyPI, add a "pending publisher" (account > Publishing) with:
#   project name: funground-ml   owner: funground-hq   repository: funground
#   workflow: release-ml.yml     environment: pypi (on PyPI) / testpypi (on TestPyPI)
# The two environments are funground's own (the `pypi` one waits for the maintainer's Approve).
#
# How it runs:
#   - "Run workflow" by hand: build ml/, publish to TestPyPI, install it from TestPyPI on Windows, macOS and Linux and run
#     a smoke test. Nothing goes to the real PyPI.
#   - Pushing a tag ml-v* (e.g. ml-v0.1.0): the same, then publish to PyPI.
# funground-ml needs the funground it was released with, so funground is released first (its tag v*), and then this one.
# A version can be uploaded only once to each index.

name: release-ml

on:
  workflow_dispatch:
  push:
    tags: ["ml-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/ml-v')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "ml-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ml
          path: ml/dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ml
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    needs: publish-testpypi
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FUNGROUND_HEADLESS: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Linux needs the Cairo library to build pycairo (as the README and guide say)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev
      - name: Install funground-ml from TestPyPI (dependencies from PyPI)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ funground-ml && break
            echo "not on TestPyPI yet, waiting"; sleep 30
          done
      - name: Smoke test (no model is downloaded)
        shell: bash
        run: |
          python - <<'EOF'
          from importlib.metadata import version
          import funground as f
          from funground import ml
          for name in ("pose", "hand", "person", "words", "sound", "teach", "guess"):
              assert callable(getattr(ml, name)), name
          print("smoke ok: funground", f.__version__, "with funground-ml", version("funground-ml"))
          EOF

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/ml-v')
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ml
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
