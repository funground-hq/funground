[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "playground"
version = "0.6.0.dev0"
description = "A tiny teaching-friendly visual programming wrapper around pygame-ce."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
