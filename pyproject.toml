[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "funground"
version = "0.1.0.dev0"
description = "Creative coding for learners: p5.js/Processing and DrawBot-style 2D drawing in Python."
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md", "funground/fonts/DejaVu-LICENSE.txt"]
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5", "pycairo>=1.27", "fonttools>=4.55", "uharfbuzz>=0.45", "skia-pathops>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=11"]   # CI tests both filter paths (P10)
extras = ["pillow>=11"]

[tool.setuptools]
packages = ["funground", "funground.platform", "funground.renderers", "funground.export"]

[tool.setuptools.package-data]
funground = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
