[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "funground"
version = "0.1.0a1"
description = "Creative coding for learners: p5.js/Processing and DrawBot-style 2D drawing in Python."
readme = "README.md"
license = "LGPL-2.1-only"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md", "funground/fonts/DejaVu-LICENSE.txt", "funground/fonts/Noto-OFL.txt", "examples/LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Samir Joshi" }]
keywords = ["creative coding", "education", "drawing", "p5", "processing", "drawbot", "generative art", "graphics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

# Each library from the version funground needs up to its next major version, where breaking changes usually come
# (D-100). The exact versions CI tests are in tests/constraints.txt and are published with each release; a weekly
# CI job tries the newest versions inside these bounds, so a breaking release is found before learners meet it.
dependencies = ["pygame-ce>=2.5,<3", "pycairo>=1.27,<2", "fonttools>=4.55,<5", "uharfbuzz>=0.45,<1",
                "skia-pathops>=0.9,<1", "svgelements>=1.9,<2", "pypdf>=5,<7"]

[project.urls]
Homepage = "https://github.com/funground-hq/funground"
Source = "https://github.com/funground-hq/funground"
Issues = "https://github.com/funground-hq/funground/issues"
Changelog = "https://github.com/funground-hq/funground/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pillow>=11", "pypdfium2>=4", "imageio-ffmpeg>=0.5", "build>=1"]   # CI tests both filter paths (P10)
extras = ["pillow>=11,<13"]
video = ["imageio-ffmpeg>=0.5,<1"]        # an ffmpeg for MP4 export (D-045 = B)

[tool.setuptools]
packages = ["funground", "funground.platform", "funground.renderers", "funground.export",
            "funground.examples", "funground.gallery_images"]

# The gallery examples ship without moving (S-103, D-049): the build maps the repository's
# own folders into the package. `funground/examples/` holds <area>/NN_name.py with its data/
# and fonts/ folders; `funground/gallery_images/` holds the pictures the browser shows. The
# examples' CC0 licence (examples/LICENSE) travels with the other licences (license-files above).
# setuptools prints a "package would be ignored" warning for each area folder: they are data
# folders, not packages, and the globs below put their files in the wheel.
[tool.setuptools.package-dir]
"funground.examples" = "examples/gallery"
"funground.gallery_images" = "docs/gallery/images"

[tool.setuptools.package-data]
funground = ["py.typed", "fonts/*.ttf", "fonts/*.txt", "data/*.json", "data/*.icc", "llms.txt", "llms-full.txt"]
"funground.examples" = ["*/*.py", "*/data/*", "*/fonts/*"]
"funground.gallery_images" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
